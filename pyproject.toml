[project]
name = "data-translate"
version = "0.1.0"
description = "Workflows for translating and evaluating dialogue datasets"
requires-python = ">3.12"
dependencies = [
  "aiolimiter>=1.2.1",
  "anyio>=4.10.0",
  "datasets>=4.0.0",
  "deep-translator>=1.11.4",
  "diskcache>=5.6.3",
  "httpx>=0.28.1",
  "hydra-core>=1.3.2",
  "jsonlines>=4.0.0",
  "litellm>=1.83.10",
  "openai>=1.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.14.0",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.6.0",
  "scipy>=1.15.0",
  "structlog>=25.4.0",
  "tenacity>=9.1.2",
  "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
  "coverage>=7.10.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
]

[project.scripts]
data-translate = "data_translate.cli.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
