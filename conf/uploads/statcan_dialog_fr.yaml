upload_id: statcan_dialog_fr
dataset_id: statcan-dialogue-dataset-retrieval
language: fr
hub:
  repo_id: DeepPavlov/statcan_dialog_fr
  type: dataset
  visibility: public
  mode: create_or_update
source:
  path: data/translated/fr/McGill_NLP_statcan_dialogue_dataset_retrieval_queries/default
export:
  local_dir: data/hf_exports/statcan_dialog_fr
  layout: multi_config
  configs:
    - config_name: queries
      data_dir: queries
      splits:
        train: train
        dev: dev
        test: test
      transforms:
        - name: serialized_dialog_content
          column: query
          translated_column: query_fr
          content_field: content
          translated_content_field: content_fr
          drop_translated_content_field: true
        - name: drop_columns
          columns:
            - query_fr
        - name: select_columns
          columns:
            - query
            - query_id
            - doc_id
    - config_name: corpus
      data_dir: corpus
      splits:
        corpus: corpus
      transforms:
        - name: select_columns
          columns:
            - doc_id
            - title
            - doc
validation:
  check_translation:
    dataset: statcan-dialogue-dataset-retrieval
    expected_errors: 0
    expected_warnings: 0

