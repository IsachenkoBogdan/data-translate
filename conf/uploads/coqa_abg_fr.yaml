upload_id: coqa_abg_fr
dataset_id: coqa_abg
language: fr
hub:
  repo_id: DeepPavlov/coqa_abg_fr
  type: dataset
  visibility: public
  mode: create_or_update
source:
  path: data/translated/fr/DeepPavlov_coqa_abg/default
export:
  local_dir: data/hf_exports/coqa_abg_fr
  layout: single_config
  config_name: default
  data_dir: data
  splits:
    train: train
    val: val
    test: test
  transforms:
    - name: select_columns
      columns:
        - id
        - story
        - target_turn
        - history_turns
        - ambiguity
        - clarification_turn
        - source
        - clarification_turn_2
validation:
  check_translation:
    dataset: coqa_abg
    expected_errors: 0
    expected_warnings: 0
notes:
  - Matches DeepPavlov/coqa_abg_es layout with one default config and train, val, test splits.
  - Source artifact is expected to use in-place translated fields from the coqa_abg dataset config.
