upload_id: faithdial_fr
dataset_id: faithdial
language: fr
hub:
  repo_id: DeepPavlov/faithdial_fr
  type: dataset
  visibility: public
  mode: create_or_update
source:
  path: data/translated/fr/DeepPavlov_FaithDial/default
export:
  local_dir: data/hf_exports/faithdial_fr
  layout: single_config
  config_name: default
  data_dir: data
  splits:
    train: train
    dev: dev
    test: test
  transforms:
    - name: select_columns
      columns:
        - dialog_idx
        - utterance_idx
        - response
        - original_response
        - history
        - knowledge
        - BEGIN
        - VRM
        - history_fr
        - knowledge_fr
validation:
  check_translation:
    dataset: faithdial
    expected_errors: 0
    expected_warnings: 0
notes:
  - Expected full export has train, dev, and test splits, matching DeepPavlov/faithdial_es.
  - French artifact contains translated history_fr and knowledge_fr fields.
  - DeepPavlov/faithdial_es additionally has response_es, original_response_es, BEGIN_es, and VRM_es.
