dataset_id: coral_queries
source:
  hf_dataset_id: DeepPavlov/coral
  hf_config: queries
artifacts:
  translated_basename: DeepPavlov_coral_queries
translation:
  source_lang: en
  target_lang: fr
  backend:
    provider: google
  passthrough_splits:
    - source:
        disk_path: data/translated/fr/DeepPavlov_coral_corpus/default
        source_kind: disk
      source_split: train
      output_split: corpus_train
    - source:
        hf_dataset_id: DeepPavlov/coral
        hf_config: qrels
      source_split: train
      output_split: qrels_train
    - source:
        hf_dataset_id: DeepPavlov/coral
        hf_config: qrels
      source_split: test
      output_split: qrels_test
  rules:
    - source: text
      target: text_fr
      strategy: dialog_turns_content
      cache: true
      options:
        content_field: content
        max_chunk_chars: 4500
evaluation:
  source_lang: English
  target_lang: French
  domain: conversational retrieval queries
  split: all
  seed: 42
  inputs:
    source:
      kind: source
    translation:
      kind: translated
  sampling:
    strategy: per_split_random
    dataset: source
    samples_per_split: 50
  field_pairs:
    - name: text_fr
      source_dataset: source
      source_field: text
      source_format: dialog_turns
      translation_dataset: translation
      translation_field: text_fr
      translation_format: dialog_turns
