dataset_id: wizard_of_wikipedia_queries
source:
  hf_dataset_id: DeepPavlov/wizard_of_wikipedia
  hf_config: queries
artifacts:
  translated_basename: DeepPavlov_wizard_of_wikipedia_queries
translation:
  source_lang: en
  target_lang: fr
  backend:
    provider: google
  passthrough_splits:
    - source:
        disk_path: data/translated/fr/DeepPavlov_wizard_of_wikipedia_corpus/default
        source_kind: disk
      source_split: test
      output_split: corpus_test
    - source:
        disk_path: data/translated/fr/DeepPavlov_wizard_of_wikipedia_corpus/default
        source_kind: disk
      source_split: train
      output_split: corpus_train
    - source:
        disk_path: data/translated/fr/DeepPavlov_wizard_of_wikipedia_corpus/default
        source_kind: disk
      source_split: valid
      output_split: corpus_valid
    - source:
        hf_dataset_id: DeepPavlov/wizard_of_wikipedia
        hf_config: qrels
      source_split: test
      output_split: qrels_test
    - source:
        hf_dataset_id: DeepPavlov/wizard_of_wikipedia
        hf_config: qrels
      source_split: train
      output_split: qrels_train
    - source:
        hf_dataset_id: DeepPavlov/wizard_of_wikipedia
        hf_config: qrels
      source_split: valid
      output_split: qrels_valid
  rules:
    - source: text
      target: text_fr
      strategy: dialog_turns_content
      cache: true
      options:
        content_field: content
    - source: persona
      target: persona_fr
      strategy: text
      cache: true
      options: {}
    - source: topic
      target: topic_fr
      strategy: text
      cache: true
      options: {}
evaluation:
  source_lang: English
  target_lang: French
  domain: knowledge-grounded dialogue
  split: all
  seed: 42
  inputs:
    source:
      kind: source
    translation:
      kind: translated
  sampling:
    strategy: per_split_random
    dataset: source
    samples_per_split: 50
  field_pairs:
    - name: text_fr
      source_dataset: source
      source_field: text
      source_format: dialog_turns
      translation_dataset: translation
      translation_field: text_fr
      translation_format: dialog_turns
    - name: persona_fr
      source_dataset: source
      source_field: persona
      source_format: text
      translation_dataset: translation
      translation_field: persona_fr
      translation_format: text
    - name: topic_fr
      source_dataset: source
      source_field: topic
      source_format: text
      translation_dataset: translation
      translation_field: topic_fr
      translation_format: text
