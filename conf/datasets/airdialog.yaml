dataset_id: airdialog
source:
  hf_dataset_id: DeepPavlov/air_dialogue
artifacts:
  translated_basename: DeepPavlov_air_dialogue
translation:
  source_lang: en
  target_lang: fr
  backend:
    provider: google
  rules:
    - source: text
      target: text
      strategy: dialog_turns_content
      cache: false
      options: {}
evaluation:
  source_lang: English
  target_lang: French
  domain: aviation
  split: all
  seed: 42
  inputs:
    source:
      kind: source
    translation:
      kind: translated
  sampling:
    strategy: stratified_by_field
    dataset: source
    field: label
    samples_per_value: 25
  field_pairs:
    - name: text
      source_dataset: source
      source_field: text
      source_format: dialog_turns
      translation_dataset: translation
      translation_field: text
      translation_format: dialog_turns
