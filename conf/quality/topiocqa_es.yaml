quality_id: topiocqa_es
source:
  hf_dataset_id: McGill-NLP/TopiOCQA
  hf_config: plain_text
translation:
  hf_dataset_id: DeepPavlov/topiocqa_es
  hf_config: default
rules:
  - source: Question
    target: Question
    strategy: text
  - source: Answer
    target: Answer
    strategy: text
  - source: Topic
    target: Topic
    strategy: text
    options:
      allow_unchanged_title_like: true
  - source: Topic_section
    target: Topic_section
    strategy: text
    options:
      allow_unchanged_title_like: true
  - source: Rationale
    target: Rationale
    strategy: text
  - source: Context
    target: Context
    strategy: text
notes:
  - Source is loaded through Hugging Face Dataset Viewer fallback because the original repository uses an old dataset script.
  - Additional_answers is intentionally excluded from static translation quality checks because DialogMTEB uses the main QA/context fields; the original validation split contains optional alternate answers, while translated artifacts keep this optional field empty.
